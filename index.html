<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0088cc">
<title>Chat Hub</title>
<link rel="manifest" href="manifest.json">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
  body { background: #f0f2f5; display: flex; flex-direction: column; }

  header {
    background: linear-gradient(135deg, #0088cc 0%, #e1306c 100%);
    color: white;
    padding: 16px;
    text-align: center;
    font-size: 18px;
    font-weight: 600;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    flex-shrink: 0;
  }

  .container {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 20px;
    padding: 20px;
    overflow-y: auto;
  }

  .card {
    flex: 1;
    min-height: 140px;
    border-radius: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: white;
    cursor: pointer;
    transition: transform 0.15s;
    box-shadow: 0 4px 16px rgba(0,0,0,0.15);
    text-decoration: none;
  }

  .card:active { transform: scale(0.97); }

  .card.telegram { background: linear-gradient(135deg, #0088cc, #00a3e0); }
  .card.instagram { background: linear-gradient(135deg, #833ab4, #fd1d1d, #fcb045); }

  .card svg { width: 60px; height: 60px; margin-bottom: 12px; }
  .card .title { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
  .card .subtitle { font-size: 13px; opacity: 0.9; }

  .navbar {
    display: flex;
    background: white;
    border-top: 1px solid #e0e0e0;
    flex-shrink: 0;
    padding-bottom: env(safe-area-inset-bottom);
  }

  .navbtn {
    flex: 1;
    padding: 12px 8px;
    background: none;
    border: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    font-size: 12px;
    color: #666;
    cursor: pointer;
    font-family: inherit;
  }

  .navbtn.active { color: #0088cc; font-weight: 600; }
  .navbtn .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: transparent; margin-top: 2px;
  }
  .navbtn.active .dot { background: #0088cc; }
</style>
</head>

<header>💬 Chat Hub</header>
