<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0088cc">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Chat Hub</title>
<link rel="manifest" href="manifest.json">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; font-family: -apple-system, "Segoe UI", Roboto, "Noto Sans Ethiopic", sans-serif; overflow: hidden; }
  body {
    background: #f0f2f5;
    display: flex;
    flex-direction: column;
    transition: background 0.3s, color 0.3s;
  }
  body.dark { background: #0f1419; color: #e7e9ea; }

  header {
    background: linear-gradient(135deg, #0088cc 0%, #e1306c 100%);
    color: white;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    flex-shrink: 0;
    padding-top: calc(12px + env(safe-area-inset-top));
  }
  header h1 { font-size: 17px; font-weight: 700; }
  header .actions { display: flex; gap: 6px; }
  header button {
    background: rgba(255,255,255,0.2);
    border: none;
    color: white;
    min-width: 38px;
    height: 38px;
    border-radius: 50%;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    padding: 0 8px;
  }
  header button:active { background: rgba(255,255,255,0.35); }

  .search-box { padding: 12px 16px; flex-shrink: 0; }
  .search-box input {
    width: 100%;
    padding: 12px 16px;
    border-radius: 24px;
    border: 1px solid #e0e0e0;
    background: white;
    font-size: 15px;
    outline: none;
    font-family: inherit;
  }
  body.dark .search-box input {
    background: #1e2732;
    color: #e7e9ea;
    border-color: #2f3336;
  }

  .grid {
    flex: 1;
    overflow-y: auto;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    padding: 0 16px 16px;
    align-content: start;
    -webkit-overflow-scrolling: touch;
  }

  .app {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px 8px;
    border-radius: 18px;
    color: white;
    cursor: pointer;
    transition: transform 0.15s;
    box-shadow: 0 3px 12px rgba(0,0,0,0.12);
    text-decoration: none;
    text-align: center;
    min-height: 130px;
    border: none;
    font-family: inherit;
    width: 100%;
  }
  .app:active { transform: scale(0.96); }
  .app .icon {
    font-size: 42px;
    margin-bottom: 8px;
    line-height: 1;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
  }
  .app .name { font-size: 15px; font-weight: 700; }
  .app .sub { font-size: 11px; opacity: 0.85; margin-top: 2px; }

  .app.telegram { background: linear-gradient(135deg, #0088cc, #00a3e0); }
  .app.instagram { background: linear-gradient(135deg, #833ab4, #fd1d1d, #fcb045); }
  .app.whatsapp { background: linear-gradient(135deg, #128c7e, #25d366); }
  .app.messenger { background: linear-gradient(135deg, #0084ff, #00c6ff); }
  .app.tiktok { background: linear-gradient(135deg, #000000, #25f4ee); }
  .app.youtube { background: linear-gradient(135deg, #ff0000, #cc0000); }
  .app.twitter { background: linear-gradient(135deg, #000000, #333333); }

  .footer {
    text-align: center;
    padding: 10px;
    padding-bottom: calc(10px + env(safe-area-inset-bottom));
    font-size: 11px;
    color: #888;
    flex-shrink: 0;
  }
  body.dark .footer { color: #666; }

  .no-result {
    grid-column: 1 / -1;
    text-align: center;
    padding: 40px 20px;
    color: #888;
    font-size: 14px;
  }

  /* Fullscreen Viewer */
  .viewer {
    position: fixed;
    inset: 0;
    background: white;
    z-index: 1000;
    display: none;
    flex-direction: column;
  }
  .viewer.open { display: flex; }
  .viewer-header {
    background: #2d3436;
    color: white;
    padding: 8px 12px;
    padding-top: calc(8px + env(safe-area-inset-top));
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }
  .viewer-header .back {
    background: rgba(255,255,255,0.15);
    border: none;
    color: white;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    font-size: 18px;
    cursor: pointer;
  }
  .viewer-header .back:active { background: rgba(255,255,255,0.3); }
  .viewer-header .title {
    flex: 1;
    font-size: 15px;
    font-weight: 600;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .viewer-header .open-ext {
    background: rgba(255,255,255,0.15);
    border: none;
    color: white;
    padding: 8px 12px;
    border-radius: 20px;
    font-size: 12px;
    cursor: pointer;
    font-family: inherit;
  }
  .viewer-header .open-ext:active { background: rgba(255,255,255,0.3); }

  .viewer iframe {
    flex: 1;
    width: 100%;
    border: none;
    background: white;
  }

  .viewer .loading {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 16px;
    color: #666;
  }
  .viewer .spinner {
    width: 40px;
    height: 40px;
    border: 4px solid #eee;
    border-top-color: #0088cc;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .viewer .blocked {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 16px;
    padding: 24px;
    text-align: center;
  }
  .viewer .blocked .icon { font-size: 64px; }
  .viewer .blocked .msg { font-size: 15px; color: #666; line-height: 1.6; }
  .viewer .blocked button {
    background: #0088cc;
    color: white;
    border: none;
    padding: 14px 28px;
    border-radius: 24px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }
</style>
</head>
<body>

<header>
  <h1>💬 <span id="appTitle">Chat Hub</span></h1>
  <div class="actions">
    <button id="langBtn" onclick="toggleLang()">EN</button>
    <button id="themeBtn" onclick="toggleTheme()">🌙</button>
  </div>
</header>

<div class="search-box">
  <input type="text" id="search" placeholder="🔍 ፈልግ..." oninput="filterApps()">
</div>

<div class="grid" id="appGrid"></div>

<div class="footer" id="footer">Chat Hub v3.0</div>

<!-- Fullscreen Viewer -->
<div class="viewer" id="viewer">
  <div class="viewer-header">
    <button class="back" onclick="closeViewer()">←</button>
    <div class="title" id="viewerTitle"></div>
    <button class="open-ext" onclick="openExternal()" id="extBtn">↗ Open</button>
  </div>
  <div class="loading" id="viewerLoading">
    <div class="spinner"></div>
    <div id="loadingText">በመጫን ላይ...</div>
  </div>
  <div class="blocked" id="viewerBlocked" style="display:none;">
    <div class="icon">🔒</div>
    <div class="msg" id="blockedMsg"></div>
    <button onclick="openExternal()" id="blockedBtn">ክፈት</button>
  </div>
  <iframe id="viewerFrame" style="display:none;"></iframe>
</div>

<script>
  // ===== i18n =====
  const i18n = {
    am: {
      appTitle: 'Chat Hub',
      search: '🔍 ፈልግ...',
      loading: 'በመጫን ላይ...',
      openExt: '↗ ክፈት',
      blockedTitle: 'ይህ አፕ በአፑ ውስጥ አይከፈትም',
      blockedMsg: 'ይህ መተግበሪያ በአፑ ውስጥ እንዲከፈት አይፈቅድም። እባክህ ከታች ያለውን ቁልፍ ተጭነህ በአዲስ ገጽ ክፈተው።',
      openNow: 'አሁን ክፈት',
      noResult: '😕 ምንም አልተገኘም',
      langLabel: 'EN',
      apps: {
        telegram: { name: 'ቴሌግራም', sub: 'መልእክቶችህን ክፈት' },
        instagram: { name: 'ኢንስታግራም', sub: 'ዲኤምህን ክፈት' },
        whatsapp: { name: 'ዋትስአፕ', sub: 'መልእክቶችህን ክፈት' },
        messenger: { name: 'መሴንጀር', sub: 'Facebook ቻት' },
        tiktok: { name: 'ቲክቶክ', sub: 'መልእክቶችህን ክፈት' },
        youtube: { name: 'ዩቲዩብ', sub: 'ቪዲዮ ተመልከት' },
        twitter: { name: 'X (Twitter)', sub: 'መልእክቶችህን ክፈት' }
      }
    },
    en: {
      appTitle: 'Chat Hub',
      search: '🔍 Search...',
      loading: 'Loading...',
      openExt: '↗ Open',
      blockedTitle: 'This app won\'t open in-app',
      blockedMsg: 'This app does not allow opening inside another app. Please tap the button below to open it in a new page.',
      openNow: 'Open Now',
      noResult: '😕 Nothing found',
      langLabel: 'አማ',
      apps: {
        telegram: { name: 'Telegram', sub: 'Open your messages' },
        instagram: { name: 'Instagram', sub: 'Open your DMs' },
        whatsapp: { name: 'WhatsApp', sub: 'Open your messages' },
        messenger: { name: 'Messenger', sub: 'Facebook chat' },
        tiktok: { name: 'TikTok', sub: 'Open your messages' },
        youtube: { name: 'YouTube', sub: 'Watch videos' },
        twitter: { name: 'X (Twitter)', sub: 'Open your messages' }
      }
    }
  };

  // ===== Apps data =====
  const apps = [
    { id: 'telegram', icon: '✈️', cls: 'telegram', url: 'https://web.telegram.org/k/', allowIframe: false },
    { id: 'instagram', icon: '📷', cls: 'instagram', url: 'https://www.instagram.com/direct/inbox/', allowIframe: false },
    { id: 'whatsapp', icon: '💚', cls: 'whatsapp', url: 'https://web.whatsapp.com', allowIframe: false },
    { id: 'messenger', icon: '💬', cls: 'messenger', url: 'https://www.messenger.com', allowIframe: false },
    { id: 'tiktok', icon: '🎵', cls: 'tiktok', url: 'https://www.tiktok.com/messages', allowIframe: false },
    { id: 'youtube', icon: '▶️', cls: 'youtube', url: 'https://m.youtube.com', allowIframe: false },
    { id: 'twitter', icon: '𝕏', cls: 'twitter', url: 'https://twitter.com/messages', allowIframe: false }
  ];

  // ===== State =====
  let lang = localStorage.getItem('lang') || 'am';
  let currentApp = null;
  let iframeTimer = null;

  // ===== Render =====
  function render() {
    const t = i18n[lang];
    document.getElementById('appTitle').textContent = t.appTitle;
    document.getElementById('search').placeholder = t.search;
    document.getElementById('langBtn').textContent = t.langLabel;
    document.getElementById('loadingText').textContent = t.loading;
    document.getElementById('extBtn').textContent = t.openExt;
    document.getElementById('blockedMsg').textContent = t.blockedMsg;
    document.getElementById('blockedBtn').textContent = t.openNow;

    const grid = document.getElementById('appGrid');
    grid.innerHTML = apps.map(a => {
      const app = t.apps[a.id];
      return `
        <button class="app ${a.cls}" data-id="${a.id}" data-name="${a.id} ${app.name.toLowerCase()}" onclick="openApp('${a.id}')">
          <span class="icon">${a.icon}</span>
          <span class="name">${app.name}</span>
          <span class="sub">${app.sub}</span>
        </button>
      `;
    }).join('');
  }

  function filterApps() {
    const q = document.getElementById('search').value.toLowerCase().trim();
    const list = document.querySelectorAll('.app');
    let visible = 0;
    list.forEach(a => {
      const name = a.dataset.name;
      if (name.includes(q)) {
        a.style.display = '';
        visible++;
      } else {
        a.style.display = 'none';
      }
    });

    let noResult = document.querySelector('.no-result');
    if (visible === 0) {
      if (!noResult) {
        noResult = document.createElement('div');
        noResult.className = 'no-result';
        noResult.textContent = i18n[lang].noResult;
        document.getElementById('appGrid').appendChild(noResult);
      }
    } else if (noResult) {
      noResult.remove();
    }
  }

  // ===== Open app in fullscreen viewer =====
  function openApp(id) {
    const app = apps.find(x => x.id === id);
    if (!app) return;

    currentApp = app;
    const t = i18n[lang];
    document.getElementById('viewerTitle').textContent = t.apps[id].name;

    // Try to go fullscreen
    requestFullscreen();

    // Show viewer
    const viewer = document.getElementById('viewer');
    viewer.classList.add('open');

    // Show loading
    document.getElementById('viewerLoading').style.display = 'flex';
    document.getElementById('viewerBlocked').style.display = 'none';
    document.getElementById('viewerFrame').style.display = 'none';

    // Try iframe
    const frame = document.getElementById('viewerFrame');
    frame.src = 'about:blank';

    setTimeout(() => {
      try {
        frame.src = app.url;
        // Wait to see if it loads
        iframeTimer = setTimeout(() => {
          // If still loading after 4 seconds, likely blocked
          document.getElementById('viewerLoading').style.display = 'none';
          document.getElementById('viewerBlocked').style.display = 'flex';
        }, 4000);
      } catch (e) {
        document.getElementById('viewerLoading').style.display = 'none';
        document.getElementById('viewerBlocked').style.display = 'flex';
      }
    }, 100);

    // If iframe loads, hide loading
    frame.onload = () => {
      clearTimeout(iframeTimer);
      setTimeout(() => {
        try {
          // Try to access content (will fail if cross-origin blocked)
          const doc = frame.contentDocument || frame.contentWindow.document;
          if (!doc || !doc.body || doc.body.innerHTML === '') {
            // Empty = blocked
            document.getElementById('viewerLoading').style.display = 'none';
            document.getElementById('viewerBlocked').style.display = 'flex';
          } else {
            document.getElementById('viewerLoading').style.display = 'none';
            document.getElementById('viewerFrame').style.display = 'block';
          }
        } catch (e) {
          // Cross-origin = blocked by X-Frame-Options
          document.getElementById('viewerLoading').style.display = 'none';
          document.getElementById('viewerBlocked').style.display = 'flex';
        }
      }, 500);
    };
  }

  function closeViewer() {
    clearTimeout(iframeTimer);
    document.getElementById('viewer').classList.remove('open');
    document.getElementById('viewerFrame').src = 'about:blank';
    document.getElementById('viewerFrame').style.display = 'none';
    currentApp = null;
    exitFullscreen();
  }

  function openExternal() {
    if (currentApp) {
      window.open(currentApp.url, '_blank');
    }
  }

  // ===== Fullscreen =====
  function requestFullscreen() {
    const el = document.documentElement;
    try {
      if (el.requestFullscreen) el.requestFullscreen();
      else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
      else if (el.mozRequestFullScreen) el.mozRequestFullScreen();
      else if (el.msRequestFullscreen) el.msRequestFullscreen();
    } catch (e) {}
  }

  function exitFullscreen() {
    try {
      if (document.fullscreenElement) {
        if (document.exitFullscreen) document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      }
    } catch (e) {}
  }

  // ===== Theme =====
  function toggleTheme() {
    document.body.classList.toggle('dark');
    const isDark = document.body.classList.contains('dark');
    document.getElementById('themeBtn').textContent = isDark ? '☀️' : '🌙';
    localStorage.setItem('theme', isDark ? 'dark' : 'light');
  }

  // ===== Language =====
  function toggleLang() {
    lang = lang === 'am' ? 'en' : 'am';
    localStorage.setItem('lang', lang);
    render();
  }

  // ===== Init =====
  if (localStorage.getItem('theme') === 'dark') {
    document.body.classList.add('dark');
    document.getElementById('themeBtn').textContent = '☀️';
  }

  render();

  // Service Worker
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .then(() => console.log('✓ SW active'))
        .catch(e => console.log('SW error:', e));
    });
  }

  // ESC to close viewer
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && currentApp) closeViewer();
  });
</script>

</body>
</html>
