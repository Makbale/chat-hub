<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0088cc">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Chat Hub</title>
<link rel="manifest" href="manifest.json">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; font-family: -apple-system, "Segoe UI", Roboto, "Noto Sans Ethiopic", sans-serif; overflow: hidden; }
  body {
    background: #f0f2f5;
    display: flex;
    flex-direction: column;
    transition: background 0.3s;
  }
  body.dark { background: #0f1419; color: #e7e9ea; }

  /* ===== Header ===== */
  header {
    background: linear-gradient(135deg, #0088cc 0%, #e1306c 100%);
    color: white;
    padding: 10px 12px;
    padding-top: calc(10px + env(safe-area-inset-top));
    display: flex;
    align-items: center;
    gap: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    flex-shrink: 0;
    z-index: 10;
  }
  header h1 {
    font-size: 16px;
    font-weight: 700;
    flex: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  header .back {
    background: rgba(255,255,255,0.2);
    border: none;
    color: white;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    font-size: 18px;
    cursor: pointer;
    display: none;
    flex-shrink: 0;
  }
  header .back.show { display: block; }
  header .back:active { background: rgba(255,255,255,0.35); }

  header .actions { display: flex; gap: 6px; flex-shrink: 0; }
  header button.icon-btn {
    background: rgba(255,255,255,0.2);
    border: none;
    color: white;
    min-width: 36px;
    height: 36px;
    border-radius: 50%;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    padding: 0 6px;
  }
  header button.icon-btn:active { background: rgba(255,255,255,0.35); }

  /* ===== Content ===== */
  .content {
    flex: 1;
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
  }

  /* Home view */
  .home {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .search-box { padding: 12px 16px; flex-shrink: 0; }
  .search-box input {
    width: 100%;
    padding: 12px 16px;
    border-radius: 24px;
    border: 1px solid #e0e0e0;
    background: white;
    font-size: 15px;
    outline: none;
    font-family: inherit;
  }
  body.dark .search-box input {
    background: #1e2732;
    color: #e7e9ea;
    border-color: #2f3336;
  }

  .grid {
    flex: 1;
    overflow-y: auto;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    padding: 0 16px 16px;
    align-content: start;
    -webkit-overflow-scrolling: touch;
  }
  .app-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px 8px;
    border-radius: 18px;
    color: white;
    cursor: pointer;
    transition: transform 0.15s;
    box-shadow: 0 3px 12px rgba(0,0,0,0.12);
    text-align: center;
    min-height: 120px;
    border: none;
    font-family: inherit;
    width: 100%;
  }
  .app-card:active { transform: scale(0.96); }
  .app-card .icon { font-size: 40px; margin-bottom: 8px; line-height: 1; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2)); }
  .app-card .name { font-size: 15px; font-weight: 700; }
  .app-card .sub { font-size: 11px; opacity: 0.85; margin-top: 2px; }

  /* App colors */
  .telegram { background: linear-gradient(135deg, #0088cc, #00a3e0); }
  .instagram { background: linear-gradient(135deg, #833ab4, #fd1d1d, #fcb045); }
  .whatsapp { background: linear-gradient(135deg, #128c7e, #25d366); }
  .messenger { background: linear-gradient(135deg, #0084ff, #00c6ff); }
  .tiktok { background: linear-gradient(135deg, #000000, #25f4ee); }
  .youtube { background: linear-gradient(135deg, #ff0000, #cc0000); }
  .twitter { background: linear-gradient(135deg, #000000, #333333); }

  /* Viewer (app iframe) */
  .viewer {
    flex: 1;
    display: none;
    flex-direction: column;
    background: white;
  }
  .viewer.open { display: flex; }

  .viewer .loading {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 16px;
    color: #666;
  }
  .viewer .spinner {
    width: 40px;
    height: 40px;
    border: 4px solid #eee;
    border-top-color: #0088cc;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .viewer .blocked {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 16px;
    padding: 24px;
    text-align: center;
  }
  .viewer .blocked .bIcon { font-size: 64px; }
  .viewer .blocked .msg { font-size: 15px; color: #666; line-height: 1.6; }
  .viewer .blocked button {
    background: #0088cc;
    color: white;
    border: none;
    padding: 14px 28px;
    border-radius: 24px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }
  .viewer iframe { flex: 1; width: 100%; border: none; background: white; }

  /* ===== Bottom bar ===== */
  .bottom-bar {
    display: flex;
    background: white;
    border-top: 1px solid #e0e0e0;
    flex-shrink: 0;
    padding-bottom: env(safe-area-inset-bottom);
    overflow-x: auto;
    overflow-y: hidden;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
    box-shadow: 0 -2px 8px rgba(0,0,0,0.05);
  }
  body.dark .bottom-bar {
    background: #1a1a1a;
    border-top-color: #2a2a2a;
  }
  .bottom-bar::-webkit-scrollbar { display: none; }

  .nav-item {
    flex: 1;
    min-width: 56px;
    padding: 8px 4px 10px;
    background: none;
    border: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    cursor: pointer;
    font-family: inherit;
    position: relative;
    color: #888;
    transition: color 0.2s;
  }
  body.dark .nav-item { color: #666; }
  .nav-item .nav-icon {
    font-size: 22px;
    line-height: 1;
    transition: transform 0.2s;
  }
  .nav-item .nav-label {
    font-size: 9px;
    font-weight: 600;
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
  }
  .nav-item.active { color: #0088cc; }
  .nav-item.active .nav-icon { transform: scale(1.15); }
  .nav-item.active::before {
    content: '';
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 24px;
    height: 3px;
    background: #0088cc;
    border-radius: 0 0 3px 3px;
  }
  .nav-item:active { background: rgba(0,0,0,0.05); }
  body.dark .nav-item:active { background: rgba(255,255,255,0.05); }

  .no-result {
    grid-column: 1 / -1;
    text-align: center;
    padding: 40px 20px;
    color: #888;
    font-size: 14px;
  }
</style>
</head>
<body>

<header>
  <button class="back" id="backBtn" onclick="goHome()">←</button>
  <h1 id="appTitle">💬 Chat Hub</h1>
  <div class="actions">
    <button class="icon-btn" id="langBtn" onclick="toggleLang()">EN</button>
    <button class="icon-btn" id="themeBtn" onclick="toggleTheme()">🌙</button>
  </div>
</header>

<div class="content">
  <!-- Home -->
  <div class="home" id="homeView">
    <div class="search-box">
      <input type="text" id="search" placeholder="🔍 ፈልግ..." oninput="filterApps()">
    </div>
    <div class="grid" id="appGrid"></div>
  </div>

  <!-- Viewer -->
  <div class="viewer" id="viewerView">
    <div class="loading" id="viewerLoading">
      <div class="spinner"></div>
      <div id="loadingText">በመጫን ላይ...</div>
    </div>
    <div class="blocked" id="viewerBlocked" style="display:none;">
      <div class="bIcon">🔒</div>
      <div class="msg" id="blockedMsg"></div>
      <button onclick="openExternal()" id="blockedBtn">ክፈት</button>
    </div>
    <iframe id="viewerFrame" style="display:none;"></iframe>
  </div>
</div>

<!-- Bottom bar (always visible) -->
<div class="bottom-bar" id="bottomBar"></div>

<script>
  // ===== i18n =====
  const i18n = {
    am: {
      appTitle: 'Chat Hub',
      search: '🔍 ፈልግ...',
      loading: 'በመጫን ላይ...',
      blockedMsg: 'ይህ አፕ በአፑ ውስጥ አይከፈትም። እባክህ ከታች ያለውን ቁልፍ ተጭነህ ክፈተው።',
      openNow: '↗ አሁን ክፈት',
      noResult: '😕 ምንም አልተገኘም',
      langLabel: 'EN',
      apps: {
        telegram: { name: 'ቴሌግራም', sub: 'መልእክቶችህን ክፈት' },
        instagram: { name: 'ኢንስታግራም', sub: 'ዲኤምህን ክፈት' },
        whatsapp: { name: 'ዋትስአፕ', sub: 'መልእክቶችህን ክፈት' },
        messenger: { name: 'መሴንጀር', sub: 'Facebook ቻት' },
        tiktok: { name: 'ቲክቶክ', sub: 'መልእክቶችህን ክፈት' },
        youtube: { name: 'ዩቲዩብ', sub: 'ቪዲዮ ተመልከት' },
        twitter: { name: 'X', sub: 'መልእክቶችህን ክፈት' }
      }
    },
    en: {
      appTitle: 'Chat Hub',
      search: '🔍 Search...',
      loading: 'Loading...',
      blockedMsg: 'This app does not allow opening inside another app. Please tap the button below to open it.',
      openNow: '↗ Open Now',
      noResult: '😕 Nothing found',
      langLabel: 'አማ',
      apps: {
        telegram: { name: 'Telegram', sub: 'Open your messages' },
        instagram: { name: 'Instagram', sub: 'Open your DMs' },
        whatsapp: { name: 'WhatsApp', sub: 'Open your messages' },
        messenger: { name: 'Messenger', sub: 'Facebook chat' },
        tiktok: { name: 'TikTok', sub: 'Open your messages' },
        youtube: { name: 'YouTube', sub: 'Watch videos' },
        twitter: { name: 'X', sub: 'Open your messages' }
      }
    }
  };

  // ===== Apps =====
  const apps = [
    { id: 'telegram', icon: '✈️', cls: 'telegram', url: 'https://web.telegram.org/k/' },
    { id: 'instagram', icon: '📷', cls: 'instagram', url: 'https://www.instagram.com/direct/inbox/' },
    { id: 'whatsapp', icon: '💚', cls: 'whatsapp', url: 'https://web.whatsapp.com' },
    { id: 'messenger', icon: '💬', cls: 'messenger', url: 'https://www.messenger.com' },
    { id: 'tiktok', icon: '🎵', cls: 'tiktok', url: 'https://www.tiktok.com/messages' },
    { id: 'youtube', icon: '▶️', cls: 'youtube', url: 'https://m.youtube.com' },
    { id: 'twitter', icon: '𝕏', cls: 'twitter', url: 'https://twitter.com/messages' }
  ];

  // ===== State =====
  let lang = localStorage.getItem('lang') || 'am';
  let currentApp = null;
  let iframeTimer = null;

  // ===== Render =====
  function render() {
    const t = i18n[lang];
    document.getElementById('appTitle').textContent = currentApp
      ? '💬 ' + t.apps[currentApp.id].name
      : '💬 ' + t.appTitle;
    document.getElementById('search').placeholder = t.search;
    document.getElementById('langBtn').textContent = t.langLabel;
    document.getElementById('loadingText').textContent = t.loading;
    document.getElementById('blockedMsg').textContent = t.blockedMsg;
    document.getElementById('blockedBtn').textContent = t.openNow;

    // Grid
    const grid = document.getElementById('appGrid');
    grid.innerHTML = apps.map(a => {
      const app = t.apps[a.id];
      return `
        <button class="app-card ${a.cls}" data-id="${a.id}" data-name="${a.id} ${app.name.toLowerCase()}" onclick="openApp('${a.id}')">
          <span class="icon">${a.icon}</span>
          <span class="name">${app.name}</span>
          <span class="sub">${app.sub}</span>
        </button>
      `;
    }).join('');

    // Bottom bar
    const bar = document.getElementById('bottomBar');
    bar.innerHTML = apps.map(a => {
      const app = t.apps[a.id];
      const isActive = currentApp && currentApp.id === a.id;
      return `
        <button class="nav-item ${isActive ? 'active' : ''}" onclick="openApp('${a.id}')">
          <span class="nav-icon">${a.icon}</span>
          <span class="nav-label">${app.name}</span>
        </button>
      `;
    }).join('');
  }

  function filterApps() {
    const q = document.getElementById('search').value.toLowerCase().trim();
    const list = document.querySelectorAll('.app-card');
    let visible = 0;
    list.forEach(a => {
      if (a.dataset.name.includes(q)) {
        a.style.display = '';
        visible++;
      } else {
        a.style.display = 'none';
      }
    });

    let noResult = document.querySelector('.no-result');
    if (visible === 0) {
      if (!noResult) {
        noResult = document.createElement('div');
        noResult.className = 'no-result';
        noResult.textContent = i18n[lang].noResult;
        document.getElementById('appGrid').appendChild(noResult);
      }
    } else if (noResult) {
      noResult.remove();
    }
  }

  // ===== Navigation =====
  function openApp(id) {
    const app = apps.find(x => x.id === id);
    if (!app) return;

    currentApp = app;
    render();

    // Show viewer, hide home
    document.getElementById('homeView').style.display = 'none';
    document.getElementById('viewerView').classList.add('open');
    document.getElementById('backBtn').classList.add('show');

    // Show loading
    document.getElementById('viewerLoading').style.display = 'flex';
    document.getElementById('viewerBlocked').style.display = 'none';
    document.getElementById('viewerFrame').style.display = 'none';

    // Reset iframe
    const frame = document.getElementById('viewerFrame');
    frame.src = 'about:blank';

    clearTimeout(iframeTimer);

    setTimeout(() => {
      try {
        frame.src = app.url;
      } catch (e) {
        document.getElementById('viewerLoading').style.display = 'none';
        document.getElementById('viewerBlocked').style.display = 'flex';
      }
    }, 50);

    // If blocked after 4 seconds, show blocked message
    iframeTimer = setTimeout(() => {
      document.getElementById('viewerLoading').style.display = 'none';
      document.getElementById('viewerBlocked').style.display = 'flex';
    }, 4000);

    frame.onload = () => {
      clearTimeout(iframeTimer);
      setTimeout(() => {
        try {
          const doc = frame.contentDocument || frame.contentWindow.document;
          if (!doc || !doc.body || doc.body.innerHTML === '') {
            document.getElementById('viewerLoading').style.display = 'none';
            document.getElementById('viewerBlocked').style.display = 'flex';
          } else {
            document.getElementById('viewerLoading').style.display = 'none';
            document.getElementById('viewerFrame').style.display = 'block';
          }
        } catch (e) {
          document.getElementById('viewerLoading').style.display = 'none';
          document.getElementById('viewerBlocked').style.display = 'flex';
        }
      }, 400);
    };
  }

  function goHome() {
    clearTimeout(iframeTimer);
    currentApp = null;
    document.getElementById('homeView').style.display = 'flex';
    document.getElementById('viewerView').classList.remove('open');
    document.getElementById('backBtn').classList.remove('show');
    document.getElementById('viewerFrame').src = 'about:blank';
    render();
  }

  function openExternal() {
    if (currentApp) {
      window.open(currentApp.url, '_blank');
    }
  }

  // ===== Theme =====
  function toggleTheme() {
    document.body.classList.toggle('dark');
    const isDark = document.body.classList.contains('dark');
    document.getElementById('themeBtn').textContent = isDark ? '☀️' : '🌙';
    localStorage.setItem('theme', isDark ? 'dark' : 'light');
  }

  // ===== Language =====
  function toggleLang() {
    lang = lang === 'am' ? 'en' : 'am';
    localStorage.setItem('lang', lang);
    render();
  }

  // ===== Init =====
  if (localStorage.getItem('theme') === 'dark') {
    document.body.classList.add('dark');
    document.getElementById('themeBtn').textContent = '☀️';
  }

  render();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    });
  }
</script>

</body>
</html>
