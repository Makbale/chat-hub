<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0088cc">
<title>Chat Hub</title>
<link rel="manifest" href="manifest.json">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; }
  body {
    background: #f0f2f5;
    display: flex;
    flex-direction: column;
    transition: background 0.3s, color 0.3s;
  }
  body.dark { background: #0f1419; color: #e7e9ea; }

  header {
    background: linear-gradient(135deg, #0088cc 0%, #e1306c 100%);
    color: white;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    flex-shrink: 0;
  }
  header h1 { font-size: 18px; font-weight: 700; }
  header button {
    background: rgba(255,255,255,0.2);
    border: none;
    color: white;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    font-size: 18px;
    cursor: pointer;
  }
  header button:active { background: rgba(255,255,255,0.35); }

  .search-box {
    padding: 12px 16px;
    flex-shrink: 0;
  }
  .search-box input {
    width: 100%;
    padding: 12px 16px;
    border-radius: 24px;
    border: 1px solid #e0e0e0;
    background: white;
    font-size: 15px;
    outline: none;
    font-family: inherit;
  }
  body.dark .search-box input {
    background: #1e2732;
    color: #e7e9ea;
    border-color: #2f3336;
  }

  .grid {
    flex: 1;
    overflow-y: auto;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    padding: 0 16px 16px;
    align-content: start;
  }

  .app {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px 8px;
    border-radius: 18px;
    color: white;
    cursor: pointer;
    transition: transform 0.15s;
    box-shadow: 0 3px 12px rgba(0,0,0,0.12);
    text-decoration: none;
    text-align: center;
    min-height: 130px;
  }
  .app:active { transform: scale(0.96); }
  .app .icon {
    font-size: 42px;
    margin-bottom: 8px;
    line-height: 1;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
  }
  .app .name { font-size: 15px; font-weight: 700; }
  .app .sub { font-size: 11px; opacity: 0.85; margin-top: 2px; }

  .app.telegram { background: linear-gradient(135deg, #0088cc, #00a3e0); }
  .app.instagram { background: linear-gradient(135deg, #833ab4, #fd1d1d, #fcb045); }
  .app.whatsapp { background: linear-gradient(135deg, #128c7e, #25d366); }
  .app.messenger { background: linear-gradient(135deg, #0084ff, #00c6ff); }
  .app.tiktok { background: linear-gradient(135deg, #000000, #25f4ee); }
  .app.youtube { background: linear-gradient(135deg, #ff0000, #cc0000); }
  .app.twitter { background: linear-gradient(135deg, #000000, #333333); }

  .footer {
    text-align: center;
    padding: 10px;
    font-size: 11px;
    color: #888;
    flex-shrink: 0;
  }
  body.dark .footer { color: #666; }

  .no-result {
    grid-column: 1 / -1;
    text-align: center;
    padding: 40px 20px;
    color: #888;
    font-size: 14px;
  }
</style>
</head>
<body>

<header>
  <h1>💬 Chat Hub</h1>
  <button id="themeBtn" onclick="toggleTheme()">🌙</button>
</header>

<div class="search-box">
  <input type="text" id="search" placeholder="🔍 ፈልግ..." oninput="filterApps()">
</div>

<div class="grid" id="appGrid">

  <a class="app telegram" href="https://web.telegram.org/k/" target="_blank" rel="noopener" data-name="telegram ቴሌግራም">
    <span class="icon">✈️</span>
    <span class="name">ቴሌግራም</span>
    <span class="sub">መልእክቶችህን ክፈት</span>
  </a>

  <a class="app instagram" href="https://www.instagram.com/direct/inbox/" target="_blank" rel="noopener" data-name="instagram ኢንስታግራም">
    <span class="icon">📷</span>
    <span class="name">ኢንስታግራም</span>
    <span class="sub">ዲኤምህን ክፈት</span>
  </a>

  <a class="app whatsapp" href="https://web.whatsapp.com" target="_blank" rel="noopener" data-name="whatsapp ዋትስአፕ">
    <span class="icon">💚</span>
    <span class="name">ዋትስአፕ</span>
    <span class="sub">መልእክቶችህን ክፈት</span>
  </a>

  <a class="app messenger" href="https://www.messenger.com" target="_blank" rel="noopener" data-name="messenger መሴንጀር facebook">
    <span class="icon">💬</span>
    <span class="name">መሴንጀር</span>
    <span class="sub">Facebook ቻት</span>
  </a>

  <a class="app tiktok" href="https://www.tiktok.com/messages" target="_blank" rel="noopener" data-name="tiktok ቲክቶክ">
    <span class="icon">🎵</span>
    <span class="name">ቲክቶክ</span>
    <span class="sub">መልእክቶችህን ክፈት</span>
  </a>

  <a class="app youtube" href="https://m.youtube.com" target="_blank" rel="noopener" data-name="youtube ዩቲዩብ">
    <span class="icon">▶️</span>
    <span class="name">ዩቲዩብ</span>
    <span class="sub">ቪዲዮ ተመልከት</span>
  </a>

  <a class="app twitter" href="https://twitter.com/messages" target="_blank" rel="noopener" data-name="twitter x ትዊተር">
    <span class="icon">𝕏</span>
    <span class="name">X (Twitter)</span>
    <span class="sub">መልእክቶችህን ክፈት</span>
  </a>

</div>

<div class="footer">Chat Hub v2.0 • በራሴ የሰራሁት</div>

<script>
  // Dark mode
  function toggleTheme() {
    document.body.classList.toggle('dark');
    const isDark = document.body.classList.contains('dark');
    document.getElementById('themeBtn').textContent = isDark ? '☀️' : '🌙';
    localStorage.setItem('theme', isDark ? 'dark' : 'light');
  }

  // Load saved theme
  if (localStorage.getItem('theme') === 'dark') {
    document.body.classList.add('dark');
    document.getElementById('themeBtn').textContent = '☀️';
  }

  // Search filter
  function filterApps() {
    const q = document.getElementById('search').value.toLowerCase().trim();
    const apps = document.querySelectorAll('.app');
    let visible = 0;

    apps.forEach(app => {
      const name = app.dataset.name.toLowerCase();
      if (name.includes(q)) {
        app.style.display = '';
        visible++;
      } else {
        app.style.display = 'none';
      }
    });

    // Show "no result" message
    let noResult = document.querySelector('.no-result');
    if (visible === 0) {
      if (!noResult) {
        noResult = document.createElement('div');
        noResult.className = 'no-result';
        noResult.textContent = '😕 ምንም አልተገኘም';
        document.getElementById('appGrid').appendChild(noResult);
      }
    } else if (noResult) {
      noResult.remove();
    }
   
  // Register Service Worker
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .then(reg => console.log('SW registered'))
        .catch(err => console.log('SW error:', err));
    });
  }
</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .then(() => console.log('✓ Service Worker active'))
        .catch(e => console.log('SW error:', e));
    });
  }
</script>
</body>
</html>
